<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <h2>Registered Contacts</h2>

    <input type="text" id="searchInput" placeholder="Search by name, email, or phone...">

    <button type="button" id="clearSearchButton">Clear Search</button>
<p id="formMessage" role="status" aria-live="polite"></p>

    <form id="registrationForm" method="post">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>

        <button type="submit" id="submitButton">Register</button>
        <button type="button" id="cancelEditButton" hidden>Cancel Edit</button>
    </form>


    </form>

    <hr>

    <h2>Registered Contacts</h2>

    <table id="contactsTable" border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="contactsTableBody">
            <!-- Contact records will appear here -->
        </tbody>
    </table>

    <p id="contactsMessage"></p>

    <script src="script.js"></script>

</body>

</html>
